<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>

  <link rel="stylesheet" href="style.css">
</head>

<body>


  <h1 id="clock">00:00:00</h1>


  <div class="box">

    <h1 id="time">0</h1>

    <div class="btn-box">
      <button class="start" onclick="startWatch()">
        Start
      </button>

      <button class="stop" onclick="stopWatch()">
        Stop
      </button>
    </div>

  </div>

  <div class="counter-box">

    <div class="card">
      <h2 class="counter" data-number="249">0</h2>
      <p>Projects</p>
    </div>

    <div class="card">
      <h2 class="counter" data-number="143">0</h2>
      <p>Clients</p>
    </div>

    <div class="card">
      <h2 class="counter" data-number="77">0</h2>
      <p>Reviews</p>
    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
